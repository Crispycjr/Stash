[mgr]
border_symbol = " "
syntect_theme = "~/.config/bat/themes/vague.tmTheme"

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "█", close = "█" }

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

[mode]
normal_main = { }
normal_alt = { }
select_main = { }
select_alt = { }
unset_main = { }
unset_alt = { }

[tabs]
active  = { fg = "white", bold = true }
inactive  = { fg = "darkgray", bg = "black" }
sep_inner  = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[icon]
dirs = [ ]
# prepend_conds = [
# 	{ if = "link", text = "", fg = "cyan" },
# 	{ if = "hidden & dir & hovered", text = "", fg = "darkgrey" },
# 	{ if = "hidden & dir", text = "", fg = "darkgrey" },
# ]

[filetype]
rules = [
    # Directories: bold blue
    { url = "*/", fg = "blue", bold = true },
    # Orphan symbolic links
	{ url = "*", is = "orphan", fg = "red" },
]

