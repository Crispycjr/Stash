format = """
$directory\
$character"""

right_format = """
$cmd_duration"""

scan_timeout = 10
add_newline = false

[package]
# disabled = true

[character]
success_symbol = '[>>](bold white)'
error_symbol = '[>>](bold red)'

[directory]
style = "blue bold"
read_only = " !"
# truncate_to_repo = false

[cmd_duration]
format = '[took $duration]($style) '
style = "bright-black"

