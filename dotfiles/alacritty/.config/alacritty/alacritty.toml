general.live_config_reload = true

[window]
dimensions = { columns = 110, lines = 32 }
padding = { x = 6, y = 6 }
title = "Alacritty"
dynamic_title = true
opacity = 1.0
blur = false
resize_increments = true
# decorations = "None"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size = 11.25

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

# [terminal]
# osc52 = "OnlyCopy"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "U"
mods = "Control|Shift"
action = "ScrollPageUp"

[[keyboard.bindings]]
key = "D"
mods = "Control|Shift"
action = "ScrollPageDown"

[colors]
draw_bold_text_with_bright_colors = true
cursor = { text = "#282C34", cursor = "#ABB2BF" }

[colors.primary]
foreground = "#ABB2BF"
background = "#282C34"

[colors.normal]
black   = "#282C34"
red     = "#E06C75"
green   = "#98C379"
yellow  = "#E5C07B"
blue    = "#61AFEF"
magenta = "#C678DD"
cyan    = "#56B6C2"
white   = "#ABB2BF"

[colors.bright]
black   = "#5C6370"
red     = "#E06C75"
green   = "#98C379"
yellow  = "#E5C07B"
blue    = "#61AFEF"
magenta = "#C678DD"
cyan    = "#56B6C2"
white   = "#FFFFFF"


