general.live_config_reload = true

[window]
dimensions = { columns = 110, lines = 32 }
padding = { x = 6, y = 6 }
title = "Alacritty"
dynamic_title = true
resize_increments = true
# opacity = 0.5
# blur = true
# decorations = "None"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size = 11.25

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

# [terminal]
# osc52 = "OnlyCopy"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "U"
mods = "Control|Shift"
action = "ScrollPageUp"

[[keyboard.bindings]]
key = "D"
mods = "Control|Shift"
action = "ScrollPageDown"

[colors]
draw_bold_text_with_bright_colors = true
cursor = { text = "#232326", cursor = "#a7aab0" }

[colors.primary]
foreground = "#a7aab0"
background = "#232326"

[colors.normal]
black   = "#101012"
red     = "#d25862"
green   = "#8fb573"
yellow  = "#dbb671"
blue    = "#57a5e5"
magenta = "#bb70d2"
cyan    = "#51a8b3"
white   = "#a7aab0"

[colors.bright]
black   = "#5a5b5e"
red     = "#d25862"
green   = "#8fb573"
yellow  = "#dbb671"
blue    = "#57a5e5"
magenta = "#bb70d2"
cyan    = "#51a8b3"
white   = "#a7aab0"
